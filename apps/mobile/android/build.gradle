// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Pin androidx.core to 1.15.0. Versions 1.17.0+ are pulled transitively
  // by some libraries and require Android Gradle Plugin 8.9.1+, but the
  // AGP shipped with Expo SDK 53's toolchain is older — the EAS build
  // fails at :app:checkReleaseAarMetadata with "requires AGP 8.9.1 or
  // higher" even though our compileSdkVersion is already 36. Forcing
  // 1.15.0 sidesteps the AGP requirement.
  configurations.all {
    resolutionStrategy.eachDependency { details ->
      if (details.requested.group == 'androidx.core'
          && (details.requested.name == 'core' || details.requested.name == 'core-ktx')) {
        details.useVersion('1.15.0')
        details.because('Pin to 1.15.0 to avoid AGP 8.9.1+ requirement on EAS')
      }
    }
  }
}

// Override SDK versions before expo-root-project sets its defaults
ext {
    compileSdkVersion = 36
    targetSdkVersion = 36
    buildToolsVersion = "36.1.0"
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
