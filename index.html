<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <!-- Hand-drawn fonts for drawing skin search results -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&family=Space+Mono:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <!-- Allow pinch-to-zoom. The Drawing Globe and other interactive maps have
       their own pinch handlers; blocking pinch globally (user-scalable=no) also
       prevents those JS handlers from seeing multi-touch events on iOS WebView. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Preconnect to R2 for faster geo data loading -->
  <link rel="preconnect" href="https://pub-6ce5ae60b244951ac36ffd277fd6ef76.r2.dev" crossorigin>
  <link rel="dns-prefetch" href="//pub-6ce5ae60b244951ac36ffd277fd6ef76.r2.dev">

  <!-- Preconnect to wsrv.nl (image proxy used for "Similar Works" thumbnails)
       and the SigLIP semantic-search worker. Doing the TLS+DNS handshake
       up front shaves ~200-400ms off the first AI recommendation render. -->
  <link rel="preconnect" href="https://wsrv.nl" crossorigin>
  <link rel="dns-prefetch" href="//wsrv.nl">
  <link rel="preconnect" href="https://armin-semantic-search.armin-art.workers.dev" crossorigin>
  <link rel="dns-prefetch" href="//armin-semantic-search.armin-art.workers.dev">

  <!-- Preconnect to Firebase for auth/data -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>

  <!-- Prefetch topology map data (avoid unused preload warning on non-map entry flows) -->
  <link rel="prefetch" href="/geodata/countries-110m.json" as="fetch" crossOrigin="anonymous" />
  
  <!-- Performance hints: speed up external image/CDN connections -->
  <link rel="preconnect" href="https://www.nationalgallery.org.uk" crossorigin>
  <link rel="dns-prefetch" href="//www.nationalgallery.org.uk">
  <link rel="preconnect" href="https://images.nationalgallery.org.uk" crossorigin>
  <link rel="dns-prefetch" href="//images.nationalgallery.org.uk">
  <link rel="preconnect" href="https://media.nationalgallery.org.uk" crossorigin>
  <link rel="dns-prefetch" href="//media.nationalgallery.org.uk">
  <!-- Optional common CDNs (maps/analytics if used) -->
  <link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="//maps.gstatic.com">
  <link rel="preconnect" href="https://www.google-analytics.com" crossorigin>
  <link rel="dns-prefetch" href="//www.google-analytics.com">
  <script type="text/javascript" src="https://static.nid.naver.com/js/naveridlogin_js_sdk_2.0.2.js"
    charset="utf-8"></script>
  <title>Armin Gallery</title>
</head>

<body>
  <div id="root"></div>
  <script>
    // Prevent double-tap-zoom only. The previous version of this script also
    // blocked multi-finger pinch gestures via stopPropagation, which prevented
    // the Drawing Globe and Interactive Map from receiving pinch-to-zoom events
    // on iOS WebView. Browser-level pinch is now governed by `touch-action` CSS:
    // interactive maps set `touch-action: none` on their root so the browser
    // leaves multi-touch to JS; other parts of the page allow normal pinch zoom.
    (function () {
      var lastTap = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        var target = e.target;
        if (target && target.closest) {
          if (
            target.closest('input, textarea, select, button, a, [contenteditable="true"]') ||
            target.closest('.ig-container')
          ) {
            lastTap = now;
            return;
          }
        }
        if (e.cancelable && now - lastTap < 300 && e.changedTouches.length === 1) {
          e.preventDefault();
        }
        lastTap = now;
      }, { passive: false });
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
