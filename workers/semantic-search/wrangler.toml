name = "armin-semantic-search"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Vectorize binding for storing embeddings
[[vectorize]]
binding = "VECTORIZE"
index_name = "armin-art-search"

# R2 binding for reading images (optional)
[[r2_buckets]]
binding = "R2"
bucket_name = "armin-gallery-images"

# HF_TOKEN will be set as a secret via wrangler secret put
