name = "armin-semantic-search"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# ────────────────────────────────────────────────────────────
# Vectorize — SigLIP 768D 인덱스
#
# 먼저 새 인덱스를 생성하세요:
#   npx wrangler vectorize create armin-art-search-768 --dimensions=768 --metric=cosine
#
# 그 다음 배포:
#   npx wrangler deploy
# ────────────────────────────────────────────────────────────
[[vectorize]]
binding = "VECTORIZE"
index_name = "armin-art-search-768"

# Jina CLIP v2 (1024D) — 새 인덱스, 마이그레이션 진행 중. 검증 후 위 인덱스를 대체할 예정.
[[vectorize]]
binding = "VECTORIZE_JINA"
index_name = "armin-art-search-jina-1024"

# ────────────────────────────────────────────────────────────
# KV — 사용자 취향 프로파일 (취향 centroids 저장)
# ────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "TASTE_KV"
id = "4ca7209a702446efb0f205bcacbae33a"

# ────────────────────────────────────────────────────────────
# HuggingFace Token (서버사이드 SigLIP 텍스트 인코딩용)
# 설정: npx wrangler secret put HF_TOKEN
# ────────────────────────────────────────────────────────────
# [vars]
# HF_TOKEN = ""  # ← secret으로 설정 (평문 금지)

# ────────────────────────────────────────────────────────────
# Workers AI — 비영어 쿼리 번역 (m2m100-1.2B)
# 현재 SigLIP base는 영어 학습 모델이므로 한국어/일본어/중국어 등
# 비라틴 쿼리는 영어로 번역한 뒤 인코딩한다. 결과는 TASTE_KV에 캐시.
# ────────────────────────────────────────────────────────────
[ai]
binding = "AI"

# ────────────────────────────────────────────────────────────
# Scheduled trigger — 기본 검색(SigLIP) 인코더 cold start 회피.
# 매 4분마다 SigLIP /encode 한 번 → 모델까지 warm 유지.
# Jina(정밀)는 드물게 쓰여 데우지 않는다. 앱이 정밀 검색을 켤 때 /warm-jina 로 깨운다.
# ────────────────────────────────────────────────────────────
[triggers]
crons = ["*/4 * * * *"]

# ────────────────────────────────────────────────────────────
# 요금 상한 — 돈이 드는 공개 라우트(AI 검색·추천·취향)를 두 겹으로 막는다.
#  - RATE_LIMITER: IP 하나가 1분에 보낼 수 있는 수 (Cloudflare 위치별로 센다)
#  - DAILY_BUDGET: 전 세계 합계 하루(한국 시간) 총량 — 건수는 src/index.ts 의 DAILY_REQUEST_BUDGET
# Cloudflare 예산 알림은 메일만 보내고 사용을 멈추지 않아서, 상한은 워커가 직접 건다.
# ────────────────────────────────────────────────────────────
# 이 wrangler(3.x)는 속도 제한을 unsafe.bindings 로만 읽는다 (4.x 의 [[ratelimits]] 와 같은 설정).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[durable_objects.bindings]]
name = "DAILY_BUDGET"
class_name = "DailyBudget"

[[migrations]]
tag = "v1-daily-budget"
new_sqlite_classes = ["DailyBudget"]

# ────────────────────────────────────────────────────────────
# D1 — 키워드 검색용 SQLite + FTS5 풀텍스트 인덱스
#
# 처음 배포 전 한 번 실행:
#   npx wrangler d1 create armin-text-search
#     → 출력된 database_id를 아래 database_id 값에 붙여넣고 주석 해제
#   npx wrangler d1 execute armin-text-search --file=./schema.sql
#   node scripts/build-d1-index.mjs            # 로컬에서 SQL dump 생성
#   npx wrangler d1 execute armin-text-search --file=./d1-seed.sql
#
# 이후 워커 코드 수정만 변경되면 그냥:
#   npx wrangler deploy
# ────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "armin-text-search"
database_id = "6e99c748-1ee0-49ee-89d7-dda9595aa032"
