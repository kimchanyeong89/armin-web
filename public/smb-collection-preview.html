<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMB Collection - Staatliche Museen zu Berlin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }
    
    header {
      background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
      padding: 2rem;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    
    .subtitle {
      color: #888;
      font-size: 0.95rem;
    }
    
    .stats-bar {
      display: flex;
      gap: 2rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    
    .stat {
      background: rgba(255,255,255,0.05);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    
    .stat-label {
      color: #888;
    }
    
    .stat-value {
      color: #4ade80;
      font-weight: 600;
    }
    
    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 0.6rem 1rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 0.95rem;
    }
    
    .search-box::placeholder {
      color: #666;
    }
    
    .search-box:focus {
      outline: none;
      border-color: #4ade80;
    }
    
    .tabs {
      display: flex;
      gap: 0;
      padding: 0 2rem;
      border-bottom: 1px solid #333;
      background: #16213e;
      overflow-x: auto;
    }
    
    .tab {
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #888;
      font-size: 0.95rem;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .tab:hover {
      color: #fff;
    }
    
    .tab.active {
      color: #fff;
      border-bottom-color: #4ade80;
    }
    
    .tab-count {
      background: rgba(255,255,255,0.1);
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }
    
    main {
      padding: 2rem;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    
    .card {
      background: #16213e;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    
    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #0f0f1a;
    }
    
    .card-content {
      padding: 1rem;
    }
    
    .card-title {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .card-meta {
      font-size: 0.8rem;
      color: #888;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    
    .card-meta span {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }
    
    .card-meta .label {
      color: #666;
      min-width: 50px;
      flex-shrink: 0;
    }
    
    .card-meta .value {
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .badge {
      display: inline-block;
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-top: 0.5rem;
    }
    
    .badge.cc-nc {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
    }
    
    .badge.pd {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
    }
    
    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      overflow-y: auto;
      padding: 2rem;
    }
    
    .modal-overlay.active {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    
    .modal {
      background: #16213e;
      border-radius: 16px;
      max-width: 1000px;
      width: 100%;
      margin: 2rem auto;
      overflow: hidden;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      border-bottom: 1px solid #333;
      gap: 1rem;
    }
    
    .modal-header h2 {
      font-size: 1.1rem;
      flex: 1;
      line-height: 1.4;
    }
    
    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      flex-shrink: 0;
    }
    
    .modal-close:hover {
      color: #fff;
    }
    
    .modal-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      padding: 1.5rem;
    }
    
    @media (max-width: 768px) {
      .modal-body {
        grid-template-columns: 1fr;
      }
    }
    
    .modal-image-container {
      position: relative;
    }
    
    .modal-image {
      width: 100%;
      border-radius: 8px;
      background: #0f0f1a;
      max-height: 500px;
      object-fit: contain;
    }
    
    .modal-credits {
      color: #666;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }
    
    .modal-details {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 70vh;
      overflow-y: auto;
    }
    
    .modal-title {
      font-size: 1.3rem;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }
    
    .detail-row {
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    
    .detail-label {
      color: #666;
      min-width: 100px;
      flex-shrink: 0;
    }
    
    .detail-value {
      color: #ddd;
      word-break: break-word;
    }
    
    .detail-section {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #333;
    }
    
    .detail-section h4 {
      color: #888;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .detail-section p {
      color: #aaa;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    
    .source-link {
      display: inline-block;
      margin-top: 1rem;
      color: #4ade80;
      text-decoration: none;
      font-size: 0.9rem;
    }
    
    .source-link:hover {
      text-decoration: underline;
    }
    
    .no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 180px;
      background: #0f0f1a;
      color: #666;
      font-size: 0.85rem;
    }
    
    .loading {
      text-align: center;
      padding: 4rem;
      color: #888;
    }
    
    .load-more {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 2rem auto;
      padding: 1rem 2rem;
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid #4ade80;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .load-more:hover {
      background: rgba(74, 222, 128, 0.3);
    }
    
    .load-more:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .results-info {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    
    .museum-badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-top: 0.5rem;
      margin-right: 0.3rem;
    }
    
    .museum-badge.humboldt { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
    .museum-badge.altes { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .museum-badge.neues { background: rgba(236, 72, 153, 0.2); color: #f472b6; }
  </style>
</head>
<body>
  <header>
    <h1>🏛️ Staatliche Museen zu Berlin - Collection</h1>
    <p class="subtitle">3,078 artworks from Humboldt Forum, Altes Museum, Neues Museum</p>
    <div class="stats-bar" id="statsBar">
      <div class="stat">
        <span class="stat-label">Showing:</span>
        <span class="stat-value" id="showingCount">-</span>
      </div>
      <div class="stat">
        <span class="stat-label">Total:</span>
        <span class="stat-value" id="totalCount">-</span>
      </div>
      <div class="stat">
        <span class="stat-label">With Image:</span>
        <span class="stat-value" id="imageCount">-</span>
      </div>
    </div>
    <div class="controls">
      <input type="text" class="search-box" id="searchBox" placeholder="Search by title, artist, type, material...">
    </div>
  </header>
  
  <div class="tabs">
    <button class="tab active" data-museum="all">All<span class="tab-count" id="countAll">-</span></button>
    <button class="tab" data-museum="smb-humboldt-forum">Humboldt Forum<span class="tab-count" id="countHumboldt">-</span></button>
    <button class="tab" data-museum="smb-altes-museum">Altes Museum<span class="tab-count" id="countAltes">-</span></button>
    <button class="tab" data-museum="smb-neues-museum">Neues Museum<span class="tab-count" id="countNeues">-</span></button>
  </div>
  
  <main>
    <p class="results-info" id="resultsInfo"></p>
    <div class="grid" id="artworkGrid">
      <div class="loading">Loading artworks...</div>
    </div>
    <button class="load-more" id="loadMore" style="display:none">Load More</button>
  </main>
  
  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Artwork Details</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  
  <script>
    let allArtworks = [];
    let filteredArtworks = [];
    let currentMuseum = 'all';
    let searchQuery = '';
    let displayCount = 50;
    const BATCH_SIZE = 50;
    
    async function loadData() {
      try {
        // Load all three collections
        const [humboldt, altes, neues] = await Promise.all([
          fetch('./data/smb-humboldt-forum-collection.json').then(r => r.json()),
          fetch('./data/smb-altes-museum-collection.json').then(r => r.json()),
          fetch('./data/smb-neues-museum-collection.json').then(r => r.json())
        ]);
        
        allArtworks = [...humboldt, ...altes, ...neues];
        console.log(`Loaded ${allArtworks.length} artworks`);
        
        updateTabs();
        applyFilters();
      } catch (e) {
        console.error(e);
        document.getElementById('artworkGrid').innerHTML = 
          `<div class="loading">Error loading data: ${e.message}</div>`;
      }
    }
    
    function updateTabs() {
      document.getElementById('countAll').textContent = allArtworks.length.toLocaleString();
      document.getElementById('countHumboldt').textContent = 
        allArtworks.filter(a => a.museumId === 'smb-humboldt-forum').length;
      document.getElementById('countAltes').textContent = 
        allArtworks.filter(a => a.museumId === 'smb-altes-museum').length.toLocaleString();
      document.getElementById('countNeues').textContent = 
        allArtworks.filter(a => a.museumId === 'smb-neues-museum').length;
    }
    
    function applyFilters() {
      displayCount = BATCH_SIZE;
      
      filteredArtworks = allArtworks.filter(a => {
        // Museum filter
        if (currentMuseum !== 'all' && a.museumId !== currentMuseum) return false;
        
        // Search filter
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const searchFields = [
            a.title, a.artist, a.type, a.medium, a.date, 
            a.description, a.inventoryNumber, a.collection
          ].filter(Boolean).join(' ').toLowerCase();
          if (!searchFields.includes(q)) return false;
        }
        
        return true;
      });
      
      updateStats();
      renderGrid();
    }
    
    function updateStats() {
      const showing = Math.min(displayCount, filteredArtworks.length);
      document.getElementById('showingCount').textContent = showing.toLocaleString();
      document.getElementById('totalCount').textContent = filteredArtworks.length.toLocaleString();
      document.getElementById('imageCount').textContent = 
        filteredArtworks.filter(a => a.imageUrl).length.toLocaleString();
      
      document.getElementById('resultsInfo').textContent = 
        `Showing ${showing.toLocaleString()} of ${filteredArtworks.length.toLocaleString()} artworks`;
    }
    
    function renderGrid() {
      const grid = document.getElementById('artworkGrid');
      const toShow = filteredArtworks.slice(0, displayCount);
      
      if (toShow.length === 0) {
        grid.innerHTML = '<div class="loading">No artworks found</div>';
        document.getElementById('loadMore').style.display = 'none';
        return;
      }
      
      grid.innerHTML = toShow.map(artwork => {
        const museumClass = artwork.museumId === 'smb-humboldt-forum' ? 'humboldt' : 
                           artwork.museumId === 'smb-altes-museum' ? 'altes' : 'neues';
        const museumName = artwork.museumId === 'smb-humboldt-forum' ? 'Humboldt' : 
                          artwork.museumId === 'smb-altes-museum' ? 'Altes' : 'Neues';
        
        const licenseClass = artwork.license?.includes('NC') ? 'cc-nc' : 
                            artwork.license?.includes('Public Domain') ? 'pd' : '';
        
        return `
          <div class="card" onclick="openModal('${artwork.id}')">
            ${artwork.imageUrl 
              ? `<img class="card-image" src="${artwork.imageUrl}" alt="${escapeHtml(artwork.title)}" loading="lazy" onerror="this.outerHTML='<div class=no-image>Image unavailable</div>'">` 
              : '<div class="no-image">No Image</div>'}
            <div class="card-content">
              <h3 class="card-title">${escapeHtml(artwork.title)}</h3>
              <div class="card-meta">
                ${artwork.artist ? `<span><span class="label">Artist:</span><span class="value">${escapeHtml(artwork.artist)}</span></span>` : ''}
                ${artwork.date ? `<span><span class="label">Date:</span><span class="value">${escapeHtml(artwork.date)}</span></span>` : ''}
                ${artwork.type ? `<span><span class="label">Type:</span><span class="value">${escapeHtml(artwork.type)}</span></span>` : ''}
              </div>
              <span class="museum-badge ${museumClass}">${museumName}</span>
              ${artwork.license ? `<span class="badge ${licenseClass}">${artwork.license}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
      
      // Show/hide load more button
      const loadMoreBtn = document.getElementById('loadMore');
      if (displayCount < filteredArtworks.length) {
        loadMoreBtn.style.display = 'block';
        loadMoreBtn.textContent = `Load More (${(filteredArtworks.length - displayCount).toLocaleString()} remaining)`;
      } else {
        loadMoreBtn.style.display = 'none';
      }
    }
    
    function loadMore() {
      displayCount += BATCH_SIZE;
      updateStats();
      renderGrid();
    }
    
    function openModal(id) {
      const artwork = allArtworks.find(a => a.id === id);
      if (!artwork) return;
      
      document.getElementById('modalTitle').textContent = artwork.title;
      
      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <div class="modal-image-container">
          ${artwork.imageUrl 
            ? `<img class="modal-image" src="${artwork.imageUrl}" alt="${escapeHtml(artwork.title)}">`
            : '<div class="no-image" style="height:300px">No Image Available</div>'}
          ${artwork.credits ? `<p class="modal-credits">${escapeHtml(artwork.credits)}</p>` : ''}
        </div>
        <div class="modal-details">
          <h3 class="modal-title">${escapeHtml(artwork.title)}</h3>
          
          <div class="detail-row">
            <span class="detail-label">Artist:</span>
            <span class="detail-value">${escapeHtml(artwork.artist || 'Unknown')}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label">Date:</span>
            <span class="detail-value">${escapeHtml(artwork.date || 'Unknown')}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label">Medium:</span>
            <span class="detail-value">${escapeHtml(artwork.medium || 'Unknown')}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label">Type:</span>
            <span class="detail-value">${escapeHtml(artwork.type || 'Unknown')}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label">Dimensions:</span>
            <span class="detail-value">${escapeHtml(artwork.dimensions || 'Unknown')}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label">Inventory:</span>
            <span class="detail-value">${escapeHtml(artwork.inventoryNumber || 'N/A')}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label">Collection:</span>
            <span class="detail-value">${escapeHtml(artwork.collection || 'N/A')}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label">Museum:</span>
            <span class="detail-value">${escapeHtml(artwork.museum)}</span>
          </div>
          
          <div class="detail-row">
            <span class="detail-label">License:</span>
            <span class="detail-value">${escapeHtml(artwork.license || 'Unknown')}</span>
          </div>
          
          ${artwork.description ? `
            <div class="detail-section">
              <h4>Description</h4>
              <p>${escapeHtml(artwork.description)}</p>
            </div>
          ` : ''}
          
          ${artwork.geographicalReferences && artwork.geographicalReferences.length > 0 ? `
            <div class="detail-section">
              <h4>Geographical References</h4>
              <p>${artwork.geographicalReferences.map(g => `${g.place}${g.type ? ` (${g.type})` : ''}`).join(', ')}</p>
            </div>
          ` : ''}
          
          ${artwork.acquisitionNotes && artwork.acquisitionNotes.length > 0 ? `
            <div class="detail-section">
              <h4>Acquisition Notes</h4>
              <p>${artwork.acquisitionNotes.join('<br>')}</p>
            </div>
          ` : ''}
          
          <a class="source-link" href="${artwork.sourceUrl}" target="_blank" rel="noopener">View on SMB Recherche →</a>
        </div>
      `;
      
      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Event listeners
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMuseum = tab.dataset.museum;
        applyFilters();
      });
    });
    
    document.getElementById('searchBox').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      applyFilters();
    });
    
    document.getElementById('loadMore').addEventListener('click', loadMore);
    
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    });
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
    
    // Load data on page load
    loadData();
  </script>
</body>
</html>
